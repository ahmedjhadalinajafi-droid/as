# جسر Baileys فقط — n8n لديك يعمل مسبقًا (لا نشغّل n8n هنا).
# Only the Baileys bridge — you already run n8n separately.
#
#   docker compose up -d --build
#   docker compose logs -f          # لرؤية رمز QR ومسحه
#
services:
  masjid-bot:
    build:
      context: ./baileys-bridge
      network: host          # يستخدم شبكة المضيف أثناء البناء لتفادي مشاكل DNS مع npm
    container_name: masjid-bot
    restart: unless-stopped
    ports:
      - "3100:3100"            # 3000 مشغول لديك (openspeedtest) لذا نستخدم 3100
    environment:
      - PORT=3100
      # الجسر ينادي n8n عبر بوابة المضيف (يصل إلى منفذ n8n المنشور 5678)
      - N8N_WEBHOOK_URL=http://host.docker.internal:5678/webhook/masjid-bot
      - KNOWLEDGE_PATH=/app/knowledge/knowledge.md
      - AUTH_DIR=/app/auth_info
      - LOG_LEVEL=silent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./baileys-bridge/auth_info:/app/auth_info   # حفظ جلسة واتساب
      - ./knowledge:/app/knowledge                  # ملف المعرفة (عدّله على المضيف)
