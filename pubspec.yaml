name: masjid_app
description: مسجد وحسينية أهل البيت - بغداد - المنصور

publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase — stable iOS-compatible versions
  firebase_core: ^3.13.1
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.5
  firebase_auth: ^5.5.2
  google_sign_in: ^6.2.2

  # Local Notifications — prayer time scheduling
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Location & Compass
  geolocator: ^14.0.2
  flutter_compass: ^0.8.0

  # Media
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  just_audio: ^0.9.36
  audio_session: ^0.1.18

  # Calendar & Date
  hijri: ^3.0.1
  intl: ^0.20.2

  # Storage & State
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  path_provider: ^2.1.2
  http: ^1.2.1

  # URL Launcher — opens social media links
  url_launcher: ^6.2.5

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/quran.json
    - assets/mafatih.json
    - assets/prayer_times_2026.json

  fonts:
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
