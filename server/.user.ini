; Raise PHP upload limits so a large app APK (e.g. 60 MB) can be published
; from the admin panel. Hostinger (LiteSpeed) reads .user.ini per-directory;
; changes can take a few minutes to apply (PHP caches it ~5 min).
upload_max_filesize = 200M
post_max_size = 210M
memory_limit = 256M
max_execution_time = 600
max_input_time = 600
