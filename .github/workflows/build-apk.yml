name: Build Masjid APK

on:
  push:
    branches:
      - claude/android-app-build-w4fyk
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Install dependencies
        working-directory: masjid_app
        run: flutter pub get

      - name: Build debug APK
        working-directory: masjid_app
        run: |
          flutter build apk \
            --debug \
            --no-tree-shake-icons \
            --suppress-analytics

      - name: Rename APK
        run: |
          mv masjid_app/build/app/outputs/flutter-apk/app-debug.apk \
             masjid_app/build/app/outputs/flutter-apk/MasjidAhlulBayt.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasjidAhlulBayt-APK
          path: masjid_app/build/app/outputs/flutter-apk/MasjidAhlulBayt.apk
          retention-days: 30

      - name: Done
        run: |
          echo "✅ APK ready to download!"
          ls -lh masjid_app/build/app/outputs/flutter-apk/
