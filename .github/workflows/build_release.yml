name: Build & Deploy APK

# Triggered from the web admin panel ("إصدار التطبيق" tab) via GitHub API,
# or manually from GitHub → Actions → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.0.2)'
        required: true
        default: '1.0.2'
      build:
        description: 'Build number (integer, must be higher than current)'
        required: true
        default: '3'
      notes:
        description: 'Release notes shown to users'
        required: false
        default: 'أحدث إصدار من تطبيق مسجد وحسينية أهل البيت'
      mandatory:
        description: 'Force update — block old version (true/false)'
        required: false
        default: 'false'
      notify:
        description: 'Send push notification to all users (true/false)'
        required: false
        default: 'true'

jobs:
  build-and-deploy:
    name: Build APK and publish to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Check out code ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/masjid-app-setup-MHlkW

      # ── 2. Java (required by Android build tools) ──────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── 4. Dependencies ───────────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 5. Build — arm64 APK (~20 MB, all modern phones) ─────────────────
      - name: Build APK
        run: flutter build apk --split-per-abi --release

      # ── 6. Upload to Hostinger via receive_build.php ──────────────────────
      - name: Upload APK to Hostinger
        env:
          API_SECRET: ${{ secrets.HOSTINGER_API_SECRET }}
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          echo "APK size: $(du -sh $APK | cut -f1)"
          curl --fail --max-time 300 \
            -X POST \
            -H "X-Api-Secret: $API_SECRET" \
            -F "apk=@$APK" \
            -F "version=${{ inputs.version }}" \
            -F "build=${{ inputs.build }}" \
            -F "notes=${{ inputs.notes }}" \
            -F "mandatory=${{ inputs.mandatory }}" \
            -F "notify=${{ inputs.notify }}" \
            "https://ahlulbaytmosque.site/app/server/receive_build.php"

      # ── 7. Keep the APK as a downloadable artifact too ───────────────────
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-v${{ inputs.version }}-build${{ inputs.build }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
